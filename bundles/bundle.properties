item.液体工艺-治愈质.description = 亲水质与相织布反应的产物，治疗修复效果更好。\n用于单位治疗、重构、状态加成以及建筑修复。

item.液体工艺-超导质.name = 超导质
item.液体工艺-超导质.description = 固态水电解产物。用于后期的电力储存传输，也可用作高级弹药。

