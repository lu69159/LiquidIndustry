block.液体工艺-冷冻液抽取机.description = 在寒冷地形抽取冷冻液。

block.液体工艺-冰冷钻井.name = 冰冷钻井
block.液体工艺-冰冷钻井.description = 利用固态冷冻液，消耗大量水来暴力抽取冷冻液。
block.液体工艺-冰冷钻井.details = 量大管饱。

block.液体工艺-废液抽取机.name = 废液抽取机
block.液体工艺-废液抽取机.description = 消耗电力，从尼普顿的冰层中提取废液。

block.液体工艺-强效抽水机.name = 强效抽水机
block.液体工艺-强效抽水机.description = 快速从地下提取水。

block.液体工艺-大型抽水机.name = 大型抽水机
block.液体工艺-大型抽水机.description = 快速从地下提取大量水。

