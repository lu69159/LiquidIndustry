block.液体工艺-冷冻液抽取机.name = Cryofluid Extractor
block.液体工艺-冷冻液抽取机.description = Extracts cryofluid in cold terrain.

block.液体工艺-冰冷钻井.name = Advanced Cryofluid Extractor
block.液体工艺-冰冷钻井.description = Extracts cryofluid violently using solid cryofluid. Consumes massive water.
block.液体工艺-冰冷钻井.details = High output.

block.液体工艺-废液抽取机.name = Waste Extractor
block.液体工艺-废液抽取机.description = Extracts waste from Nepture's ice layers.

block.液体工艺-强效抽水机.name = High-Power Water Extractor
block.液体工艺-强效抽水机.description = Extracts groundwater rapidly.

block.液体工艺-大型抽水机.name = Large Water Extractor
block.液体工艺-大型抽水机.description = Extracts large amounts of groundwater rapidly.

block.液体工艺-硬质石油钻井.name = Advanced Oil Extractor
block.液体工艺-硬质石油钻井.description = Uses large amounts of power, sand and water to drill for oil on any terrain.



