unit.液体工艺-水黾.name = 水黾
unit.液体工艺-水黾.description = 水陆两用坦克，速度极快，向附近的敌人发射电弧。

unit.液体工艺-筏蛛.name = 筏蛛
unit.液体工艺-筏蛛.description = 水陆两用坦克2型，向附近的敌人发射强力能量束。

unit.液体工艺-河狸.name = 河狸
unit.液体工艺-河狸.description = 水陆两用坦克3型，向附近的敌人发射高能带电激光。\n内部搭载一台微型水黾。

unit.液体工艺-电鳐.name = 电鳐
unit.液体工艺-电鳐.description = 水陆两用坦克4型，搭载激光主炮与能量场发生器，电击范围内的敌方并修复友方。\n两门小型电磁炮会向周围敌人发射潮湿电荷子弹。

unit.液体工艺-巨蟹.name = 巨蟹
unit.液体工艺-巨蟹.description = 水陆两用坦克5型，升级了高能激光主炮与能量束侧炮。\n装备修复抑制器和护盾发生器以提高作战能力。



