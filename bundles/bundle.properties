#core
block.液体工艺-微型核心基座.name = Mini Core Base
block.液体工艺-微型核心基座.description = Build base to increase core count, also used to unload core resources. Cannot build after 12 cores.

block.液体工艺-闪电核心.name = Core: Lightning
block.液体工艺-闪电核心.description = Modified core nucleus with built-in small unit electric field and moderate power output.\nCore units are immune to negative effects of cold weather.

block.液体工艺-雷霆核心.name = Core: Thunder
block.液体工艺-雷霆核心.description = Upgraded Lightning Core.Larger unit electric field with greater damage.\nCore units are immune to negative effects of cold weather.



#turret
block.液体工艺-作弊炮塔.name = Cheater
block.液体工艺-作弊炮塔.description = [red]WTF!
block.液体工艺-作弊炮塔.details = Stats are random. QWQ

block.液体工艺-德鲁伊.name = Druid
block.液体工艺-德鲁伊.description = Attacks mid-range ground targets and repairs buildings.\n.Prioritizes enemies with lower health.

block.液体工艺-电磁风暴.name = Tempest
block.液体工艺-电磁风暴.description = Releases massive energy in an instant by using ammo as charge carrier.\nDeals arc damage when destroyed.

block.液体工艺-极光.name = Aurora
block.液体工艺-极光.description = Fires charged laser at highest-health enemy in range\nLow initial damage,but damage rises over time if target is not switched.

block.液体工艺-电裂.name = E-Scatter
block.液体工艺-电裂.description = Fires electromagnetic burst rounds at enemy aircraft.

block.液体工艺-禁空.name = Skyfall
block.液体工艺-禁空.description = Tears enemy aircraft completely.

block.液体工艺-破防.name = Rupture
