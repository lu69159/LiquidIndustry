planet.液体工艺-Nepture.name = Nepture
planet.液体工艺-Nepture.description = Extremely low temperature, pitch black, and perennial blizzards. Surface minerals are scarce, with abundant undeveloped liquid resources.



#————BLOCKS————#



#单位
block.液体工艺-倍乘级单位直构工厂.name = Multiplicative Direct Fabricator
block.液体工艺-倍乘级单位直构工厂.description = Directly reconstructs inputted units from the first tier to the third tier.

block.液体工艺-多幂级单位直构工厂.name = Exponential Direct Fabricator
block.液体工艺-多幂级单位直构工厂.description = Directly reconstructs inputted units from the first tier to the fourth tier.

block.液体工艺-无量级单位直构工厂.name = Tetrative Direct Fabricator
block.液体工艺-无量级单位直构工厂.description = Directly reconstructs inputted units from the first tier to the fifth and final tier.

block.液体工艺-辅助工厂.name = Support Factory
block.液体工艺-辅助工厂.description =  Rapidly produces pure support units (no attack capability).



#电力
block.液体工艺-碳发电机.name = Carbon Generator
block.液体工艺-碳发电机.description = Consumes graphite to generate electricity, with higher efficiency than directly burning coal.
block.液体工艺-碳发电机.details = “Mini RTG”

block.液体工艺-重水核反应堆.name = Heavy Water Nuclear Reactor
block.液体工艺-重水核反应堆.description = Uses heavy water as moderator to greatly improve power generation efficiency; still requires constant coolant supply.\nInsufficient coolant or moderator supply will cause violent explosion.
block.液体工艺-重水核反应堆.details = When heavy water is less than 10, coolant consumption will increase significantly.

block.液体工艺-爆燃反应炉.name = Deflagration Reactor
block.液体工艺-爆燃反应炉.description = Generates massive power by detonating solid oil, produces scrap, and requires super-cryofluid for cooling.\nInsufficient super-cryofluid or unremoved scrap will cause violent explosion!

block.液体工艺-超导节点.name = Superconducting Node
block.液体工艺-超导节点.description = Super power node with greatly enhanced connection range and max connections.

block.液体工艺-大型超导节点.name = Superconducting Node Large
block.液体工艺-大型超导节点.description = An advanced superconducting node with greater range.

block.液体工艺-超导电力塔.name = Superconducting Tower
block.液体工艺-超导电力塔.description = A long-range superconducting node with fewer available connections.

block.液体工艺-超导电池.name = Superconducting Battery
block.液体工艺-超导电池.description = Stores power in times of surplus energy. Outputs power in times of deficit.

block.液体工艺-大型超导电池.name = Superconducting Battery Large
block.液体工艺-大型超导电池.description = Stores power in times of surplus energy. Outputs power in times of deficit.\nHigher capacity than a standard superconducting battery.



#辅助
block.液体工艺-中型照明器.name = Illuminator Medium
block.液体工艺-中型照明器.description = Emits bright light.

block.液体工艺-大型照明器.name = Illuminator Large
block.液体工艺-大型照明器.description = Emits bright light.

block.液体工艺-人造太阳.name = Artificial Sun
block.液体工艺-人造太阳.description = Emits full map light.

block.液体工艺-预警雷达.name = Warning Radar
block.液体工艺-预警雷达.description = Detects incoming enemies in bad weather.

block.液体工艺-超速天穹.name = Overdrive Apex
block.液体工艺-超速天穹.description = Increases the speed of nearby buildings, requires cryofluid to operate.\nOptionally uses phase fabric to boost range and efficiency. Does not stack.

block.液体工艺-流体分配力场.name = Fluid Distribute Projector
block.液体工艺-流体分配力场.description = Continuously supplies liquids or gases to buildings in range. Does not affect conduits or tanks.\nOptionally uses phase fabric to boost range.

block.液体工艺-流体投射力场.name = Fluid Distribute Dome
block.液体工艺-流体投射力场.description = Continuously supplies liquids or gases to buildings in range, faster and larger than the projector. Does not affect conduits or tanks.\nOptionally uses phase fabric to boost range and efficiency.


block.液体工艺-超频投影.name = Overclock Projector
block.液体工艺-超频投影.description = Grants overclock status to nearby units.

block.液体工艺-保护投影.name = Shield Projector
block.液体工艺-保护投影.description = Grants shield status to nearby units.

block.液体工艺-解冻投影.name = Defrost Projector
block.液体工艺-解冻投影.description = Makes units immune to negative effects of cold weather.
block.液体工艺-解冻投影.details = Grants immunity to freezing and other status for nearby units.

block.液体工艺-状态穹顶.name = Status Dome
block.液体工艺-状态穹顶.description = Grants overclock and shield status to nearby units with larger range and longer duration.

block.液体工艺-弱化投影.name = Sapped Projector
block.液体工艺-弱化投影.description = Grants sapped status to nearby enemies.

block.液体工艺-麻痹投影.name = Electrified Projector
block.液体工艺-麻痹投影.description = Grants electrified status to nearby enemies.

block.液体工艺-缓速投影.name = Slow Projector
block.液体工艺-缓速投影.description = Grants slow status to nearby enemies.

block.液体工艺-弱化穹顶.name = Sapped Dome
block.液体工艺-弱化穹顶.description = Grants sapped status to nearby enemies with larger range and longer duration.

block.液体工艺-麻痹穹顶.name = Electrified Dome
block.液体工艺-麻痹穹顶.description = Grants electrified status to nearby enemies with larger range and longer duration.

block.液体工艺-缓速穹顶.name = Slow Dome
block.液体工艺-缓速穹顶.description = Grants slow status to nearby enemies with larger range and longer duration.



#核心
block.液体工艺-微型核心基座.name = Mini Core Base
block.液体工艺-微型核心基座.description = Build base to increase core count, also used to unload core resources. Cannot build after 12 cores.

block.液体工艺-闪电核心.name = Lightning Core
block.液体工艺-闪电核心.description = Modified core nucleus with built-in small unit electric field and moderate power output.\nCore units are immune to negative effects of cold weather.

block.液体工艺-雷霆核心.name = Thunder Core
block.液体工艺-雷霆核心.description = Upgraded Lightning Core.Larger unit electric field with greater damage.\nCore units are immune to negative effects of cold weather.



#炮塔
block.液体工艺-作弊炮塔.name = Cheater
block.液体工艺-作弊炮塔.description = [red]WTF!
block.液体工艺-作弊炮塔.details = Stats are random. QWQ

block.液体工艺-德鲁伊.name = Druid
block.液体工艺-德鲁伊.description =  Attacks mid-range ground targets and repairs buildings.\n.Prioritizes enemies with lower health.

block.液体工艺-电磁风暴.name = Tempest
block.液体工艺-电磁风暴.description =  Releases massive energy in an instant by using ammo as charge carrier.\nDeals arc damage when destroyed.

block.液体工艺-极光.name = Aurora
block.液体工艺-极光.description = Fires charged laser at highest-health enemy in range\nLow initial damage,but damage rises over time if target is not switched.

block.液体工艺-电裂.name = E-Scatter
block.液体工艺-电裂.description = Fires electromagnetic burst rounds at enemy aircraft.

block.液体工艺-禁空.name = Skyfall
block.液体工艺-禁空.description = Tears enemy aircraft completely.

block.液体工艺-破防.name = Breach
block.液体工艺-破防.description = Low cost, high damage, but low health.\n[red]Explodes on destruction.
block.液体工艺-破防.details = Supported by DIMENSION.

block.液体工艺-埋伏.name = Ambush
block.液体工艺-埋伏.description = Fires mines at enemy ground units. unexploded mines remain for a time.

block.液体工艺-爆破.name = Blast
block.液体工艺-爆破.description = Fires infinite-penetration shockwaves at enemy ground targets.



#墙
block.液体工艺-装甲储液罐.name = 装甲储液罐
block.液体工艺-装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用。

block.液体工艺-大型装甲储液罐.name = 大型装甲储液罐
block.液体工艺-大型装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用。

block.液体工艺-塑钢装甲储液罐.name = 塑钢装甲储液罐
block.液体工艺-塑钢装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用, 兼具塑钢墙的特性。

block.液体工艺-大型塑钢装甲储液罐.name = 大型塑钢装甲储液罐
block.液体工艺-大型塑钢装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用, 兼具塑钢墙的特性。

block.液体工艺-合金装甲储液罐.name = 合金装甲储液罐
block.液体工艺-合金装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用, 兼具合金墙的特性。

block.液体工艺-大型合金装甲储液罐.name = 大型合金装甲储液罐
block.液体工艺-大型合金装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用, 兼具合金墙的特性。

block.液体工艺-相织装甲储液罐.name = 相织装甲储液罐
block.液体工艺-相织装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用, 兼具相织布墙的特性。

block.液体工艺-大型相织装甲储液罐.name = 大型相织装甲储液罐
block.液体工艺-大型相织装甲储液罐.description = 保护己方建筑，挡下敌方炮弹。能够作为储液罐使用, 兼具相织布墙的特性。

block.液体工艺-超能墙.name = 超能墙
block.液体工艺-超能墙.description = 保护己方建筑，挡下敌方炮弹。综合了所有装甲储液罐的功能，可以放置在深水上。

block.液体工艺-大型超能墙.name = 大型超能墙
block.液体工艺-大型超能墙.description = 保护己方建筑，挡下敌方炮弹。综合了所有装甲储液罐的功能，可以放置在深水上。

block.液体工艺-巨型超能墙.name = 巨型超能墙
block.液体工艺-巨型超能墙.description = 保护己方建筑，挡下敌方炮弹。综合了所有装甲储液罐的功能，可以放置在深水上。

block.液体工艺-力场墙.name = 力场墙
block.液体工艺-力场墙.description = 在通电时生成能阻拦敌方子弹和单位的力场护盾，能够吸收激光，也能传导电力。电力不足时护盾最大值以及恢复速度均会降低。\n允许己方单位通过。



#生产
block.液体工艺-冰冷废液分离机.name = 冰冷废液分离机
block.液体工艺-冰冷废液分离机.description = 直接不稳定低效地提取冰冷废液中的可用物质，多余材料会被焚毁。\n可以获取钛。

block.液体工艺-一级废液解离机.name = 一级废液解离机
block.液体工艺-一级废液解离机.description = 直接不稳定低效地提取一级精炼废液中的可用物质，多余材料会被焚毁。\n可以获取钍。

block.液体工艺-二级废液精馏器.name = 二级废液精馏器
block.液体工艺-二级废液精馏器.description = 从经过两次浓缩的废液中缓慢提取部分合成物质。

block.液体工艺-三级精华转化器.name = 三级精华转化器
block.液体工艺-三级精华转化器.description = 高效提取各种合成物质。

block.液体工艺-四级精华转化仪.name = 四级精华转化仪
block.液体工艺-四级精华转化仪.description = 稳定提取大部分可用物质。

block.液体工艺-终能聚合器.name = 终能聚合器
block.液体工艺-终能聚合器.description = 消耗大量资源和电力，只为提取神秘物质。\n不及时处理积累的液体副产物会导致爆炸。

block.液体工艺-神能破碎机.name = 神能破碎机
block.液体工艺-神能破碎机.description = 将输入的神秘物质破碎为更多的神秘碎片，破碎过程需要超级冷冻液冷却。

block.液体工艺-精华提取源.name = 精华提取源
block.液体工艺-精华提取源.description = 将含有少量杂质的神能精华转变为除神秘物质外的任意固体物质。



block.液体工艺-废液离心机.name = 废液离心机
block.液体工艺-废液离心机.description = 初步将冰冷废液提炼为一级精炼废液和废料。

block.液体工艺-再精炼高炉.name = 再精炼高炉
block.液体工艺-再精炼高炉.description = 稳定提取一级精炼废液中的可用金属，同时浓缩未提取的合成物质。

block.液体工艺-精华提取工厂.name = 精华提取工厂
block.液体工艺-精华提取工厂.description = 输入高温矿渣液热解二级精炼废液以获取废液精华。\n建议配合液体卸载器以分离液体输出。

block.液体工艺-精华浓缩厂.name = 精华浓缩厂
block.液体工艺-精华浓缩厂.description = 继续浓缩三级废液中的精华物质以达到提取标准。

block.液体工艺-神能凝聚仪.name = 神能凝聚仪
block.液体工艺-神能凝聚仪.description = 借助神秘物质和其他资源，将输入液体蕴涵的绝大部分神能精华提纯。\n[red]最好不要让其被摧毁。

block.液体工艺-聚能再精炼炉.name = 聚能再精炼炉
block.液体工艺-聚能再精炼炉.description = 体积更小，不再输出物品，但精炼液体能力大幅提高。



block.液体工艺-废液混合器.name = 废液混合器
block.液体工艺-废液混合器.description = 将废料和冷冻液混合成废液。

block.液体工艺-冷冻液搅拌机.name = 冷冻液搅拌机
block.液体工艺-冷冻液搅拌机.description = 利用钛、亲水质和冷冻液之间的反应，将少量冷冻液转化为更多的冷冻液。

block.液体工艺-超冷混合器.name = 超冷混合器
block.液体工艺-超冷混合器.description = 将冷冻液和三级精华废液混合以制取超级冷冻液。

block.液体工艺-重水生产器.name = 重水生产器
block.液体工艺-重水生产器.description = 使用钍做催化剂以生产重水。

block.液体工艺-高炉.name = 高炉
block.液体工艺-高炉.description = 将大量废料迅速熔化成矿渣液。

block.液体工艺-大型粉碎机.name = 大型粉碎机
block.液体工艺-大型粉碎机.description = 将废料粉碎成细沙，效率更高。

block.液体工艺-亲水质合成器.name = 亲水质合成器
block.液体工艺-亲水质合成器.description = 使用石墨和水合成亲水质。

block.液体工艺-治愈质压缩机.name = 治愈质压缩机
block.液体工艺-治愈质压缩机.description = 将相织布与亲水质在高压下混合反应形成治愈质，使用冷冻液吸收反应产生的热量。

block.液体工艺-超导裂解器.name = 超导裂解器
block.液体工艺-超导裂解器.description = 消耗巨量电力裂解固态水以制造超导质。

block.液体工艺-固液转化器.name = 固液转化器
block.液体工艺-固液转化器.description = 使用少量亲水质压缩大量液体，形成便于跨区块运输的固态形态的液体。\n同时用于解包固态液体。

block.液体工艺-硅炉.name = 硅炉
block.液体工艺-硅炉.description = 将沙和石墨精炼为硅。

block.液体工艺-塑钢分解器.name = 塑钢分解器
block.液体工艺-塑钢分解器.description = 将塑钢分解为石油和钛。

block.液体工艺-相织布分解器.name = 相织布分解器
block.液体工艺-相织布分解器.description = 将相织布分解为钍和沙。

block.液体工艺-巨浪合金分解器.name = 巨浪合金分解器
block.液体工艺-巨浪合金分解器.description = 将巨浪合金分解为铜，铅，钛和硅。



#物流
block.液体工艺-双传带.name = 双传带
block.液体工艺-双传带.description = 传输物品与液体（同时进行），不会发生泄漏。

block.液体工艺-双传桥.name = 双传桥
block.液体工艺-双传桥.description = 跨越任何地形或建筑物传输物品与液体（同时进行）。

block.液体工艺-双传交叉器.name = 双传交叉器
block.液体工艺-双传交叉器.description = 用于交叉双传带，其两端器件认为直接相连。

block.液体工艺-双传路由器.name = 双传路由器
block.液体工艺-双传路由器.description = 向四个方向平均输出物品与液体,速度更快。
block.液体工艺-双传路由器.details = 串连时的物品传输速度比路由器串连快得多。

block.液体工艺-钍传送带.name = 钍传送带
block.液体工艺-钍传送带.description = 向前运输物品，速度更快。

block.液体工艺-重甲传送轨道.name = 重甲传送轨道
block.液体工艺-重甲传送轨道.description = 向前运输物品，不接受侧面输入，除非来自其他传送带。\n拥有高血量高装甲，适合用于前线。被摧毁时释放电弧伤害敌人。

block.液体工艺-相织布卸载器.name = 相织布卸载器
block.液体工艺-相织布卸载器.description = 从周围的建筑卸载指定物品，速度更快。

block.液体工艺-高压发射器.name = 高压发射器
block.液体工艺-高压发射器.description = 借助水压驱动的廉价质驱, 无需电力，跨越任何地形传输物体。\n发射端和接收端都需要水来驱动。

block.液体工艺-微型质驱.name = 微型质驱
block.液体工艺-微型质驱.description = 微型质量驱动器，适合在狭窄的区域跨地形传输物品。



#液流
block.液体工艺-巨型储液罐.name = 巨型储液罐
block.液体工艺-巨型储液罐.description = 借助亲水质储存巨量液体，并像液体路由器一样朝各个方向输出液体。

block.液体工艺-钛导管桥.name = 钛导管桥
block.液体工艺-钛导管桥.description = 跨越任意地形或建筑物传输液体。

block.液体工艺-液体卸载器.name = 液体卸载器
block.液体工艺-液体卸载器.description = 从周围的建筑卸载指定液体。\n可用于分离多液体输出工厂的输出。

block.液体工艺-真空泵.name = 真空泵
block.液体工艺-真空泵.description = 快速泵送液体，需要大量电力。

block.液体工艺-液体质驱.name = 液体质驱
block.液体工艺-液体质驱.description = 跨越任何地形直接传输液体！只能存在一个质驱输入/输出。\n不能传输气体。

block.液体工艺-微型液体质驱.name = 微型液体质驱
block.液体工艺-微型液体质驱.description = 微型液体质量驱动器，适合在狭窄的区域跨地形传输液体，只能存在一个质驱输入/输出。\n不能传输气体。



