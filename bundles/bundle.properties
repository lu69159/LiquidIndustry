liquid.液体工艺-冰冷废液.name = 冰冷废液
liquid.液体工艺-冰冷废液.description = 于尼普顿发现的液体资源，组成结构复杂，尚未知道其形成原理。

liquid.液体工艺-一级精炼废液.name = 一级精炼废液
liquid.液体工艺-一级精炼废液.description = 冰冷废液初步提炼的液态产物，金属成分浓度已经足以被提取。

liquid.液体工艺-二级精炼废液.name = 二级精炼废液
liquid.液体工艺-二级精炼废液.description = 冰冷废液二次提炼的液态产物，可从中少量提取各种合成物质。

liquid.液体工艺-三级精华废液.name = 三级精华废液
liquid.液体工艺-三级精华废液.description = 从冰冷废液中多次提纯的液态产物，其浓度已经能检测到神秘物质的存在。

liquid.液体工艺-四级浓缩精华液.name = 四级浓缩精华液
