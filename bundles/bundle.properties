unit.液体工艺-基石.name = 基石
unit.液体工艺-基石.description = 不能攻击的基座核心机。\n[yellow]你居然试图在基座上复活？

unit.液体工艺-伽马-S.name = 伽马-S
unit.液体工艺-伽马-S.description = 伽马改装版，保护闪电核心，可建造建筑。

